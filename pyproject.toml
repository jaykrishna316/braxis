[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "braxis"
version = "1.3.0"
description = "Auto-generate AI agent context files"
readme = "README.md"
requires-python = ">=3.8"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "A",           # flake8-builtins
    "C4",          # comprehensions
]
ignore = [
    "E501",        # line-too-long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["braxis"]

[tool.ruff.format]
line-length = 100
