name: Regression Test Suite

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Regression Tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e .

      - name: Run regression test suite
        id: tests
        run: python3 -m unittest discover -v 2>&1 | tee test-output.txt

      - name: Parse and report test results
        if: always()
        run: |
          echo "## Regression Test Results" >> $GITHUB_STEP_SUMMARY
          if grep -q "FAILED\|ERROR" test-output.txt; then
            echo "❌ Tests failed" >> $GITHUB_STEP_SUMMARY
            grep "FAILED\|ERROR" test-output.txt >> $GITHUB_STEP_SUMMARY || true
          else
            TESTS=$(grep -oP "Ran \K[0-9]+" test-output.txt || echo "?")
            echo "✅ All $TESTS tests passed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Full Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
