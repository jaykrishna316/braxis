name: Regression Test Suite

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Regression Tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e .

      - name: Run regression test suite
        id: tests
        run: |
          python3 -m unittest discover -v 2>&1 | tee test-results.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Report test results
        if: always()
        run: |
          echo "## ✅ Regression Test Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Extract test count
          TEST_COUNT=$(grep -o "Ran [0-9]*" test-results.log | grep -o "[0-9]*" || echo "N/A")
          echo "**Tests Run:** $TEST_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Show last 30 lines of output
          echo "### Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -30 test-results.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
