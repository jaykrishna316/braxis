name: Braxis Context Auto-Sync

on:
  pull_request:
    branches: [main, develop, master]
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'
      - 'setup.py'
      - 'pyproject.toml'
      - '.github/workflows/braxis-sync.yml'

jobs:
  braxis-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install -q braxis

      - run: braxis generate

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet AGENTS.md CLAUDE.md .cursorrules .agentic-config.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md CLAUDE.md .cursorrules .agentic-config.json
          git commit -m "chore: regenerate braxis context files"
          git push

      - name: Post comment
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Braxis context files automatically updated and committed to this PR'
            })

      - name: Post comment - no changes
        if: steps.changes.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Context files already up to date'
            })
